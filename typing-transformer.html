<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Typing Transformer</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:ital,wght@0,400;0,700;1,400&family=Syne:wght@400;600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0a0a0f;
      --surface:   #111118;
      --border:    #1e1e2e;
      --accent:    #7c6aff;
      --accent2:   #ff6ac1;
      --muted:     #3a3a5c;
      --text:      #e2e2f0;
      --sub:       #6b6b8a;
      --green:     #4ade80;
      --red:       #f87171;
      --radius:    12px;
      --blob1:     rgba(124,106,255,.12);
      --blob2:     rgba(255,106,193,.09);
    }

    /* ── Light theme ── */
    html.light {
      --bg:        #f4f3ff;
      --surface:   #ffffff;
      --border:    #dddaf7;
      --accent:    #6254e8;
      --accent2:   #e8449f;
      --muted:     #b8b4d8;
      --text:      #1a1730;
      --sub:       #7b76a8;
      --green:     #16a34a;
      --red:       #dc2626;
      --blob1:     rgba(98,84,232,.08);
      --blob2:     rgba(232,68,159,.06);
    }

    html, body {
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      overflow-x: hidden;
      transition: background .3s, color .3s;
    }

    /* ── noise grain overlay ── */
    body::before {
      content: '';
      position: fixed; inset: 0; z-index: 0; pointer-events: none;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      opacity: .35;
    }

    /* ── glowing blob bg ── */
    .blob {
      position: fixed; border-radius: 50%; filter: blur(100px); pointer-events: none; z-index: 0;
      transition: background .4s;
    }
    .blob-1 { width: 500px; height: 500px; background: var(--blob1); top: -120px; left: -120px; }
    .blob-2 { width: 400px; height: 400px; background: var(--blob2); bottom: -80px; right: -80px; }

    /* ── layout ── */
    .wrapper {
      position: relative; z-index: 1;
      max-width: 960px; margin: 0 auto;
      padding: 48px 24px 80px;
    }

    /* ── header ── */
    header {
      display: flex; align-items: flex-end; gap: 16px;
      margin-bottom: 48px;
      animation: fadeUp .5s ease both;
    }
    .logo-icon {
      width: 48px; height: 48px; border-radius: 14px;
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      display: flex; align-items: center; justify-content: center;
      font-size: 22px; flex-shrink: 0;
      box-shadow: 0 0 30px rgba(124,106,255,.3);
    }
    .logo-text h1 {
      font-size: 28px; font-weight: 800; letter-spacing: -.5px;
      line-height: 1;
    }
    .logo-text span {
      font-family: 'Space Mono', monospace;
      font-size: 11px; color: var(--sub); letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* ── cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 16px;
      animation: fadeUp .5s ease both;
      transition: background .3s, border-color .3s;
    }
    .card:nth-child(2) { animation-delay: .06s; }
    .card:nth-child(3) { animation-delay: .12s; }
    .card:nth-child(4) { animation-delay: .18s; }

    .card-label {
      font-size: 11px; font-weight: 700; letter-spacing: 2px;
      text-transform: uppercase; color: var(--sub);
      display: flex; align-items: center; gap: 8px;
      margin-bottom: 14px;
    }
    .card-label .dot {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent);
    }

    /* ── textarea / pre ── */
    textarea, .json-area {
      width: 100%;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 13px;
      line-height: 1.7;
      padding: 14px 16px;
      resize: vertical;
      outline: none;
      transition: border-color .2s;
    }
    textarea:focus, .json-area:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124,106,255,.12);
    }
    textarea { min-height: 110px; }
    .json-area { min-height: 160px; }

    /* ── button row ── */
    .btn-row {
      display: flex; align-items: center; gap: 12px;
      flex-wrap: wrap;
    }

    button {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 11px 22px;
      border-radius: 8px;
      border: none; cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 14px; font-weight: 700;
      letter-spacing: .3px;
      transition: transform .15s, box-shadow .15s, opacity .15s;
    }
    button:active { transform: scale(.97); }

    .btn-primary {
      background: linear-gradient(135deg, var(--accent), #9b6aff);
      color: #fff;
      box-shadow: 0 4px 20px rgba(124,106,255,.35);
    }
    .btn-primary:hover { box-shadow: 0 6px 28px rgba(124,106,255,.5); }

    .btn-ghost {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--sub);
    }
    .btn-ghost:hover { border-color: var(--muted); color: var(--text); }

    /* ── output ── */
    .output-wrap {
      position: relative;
    }
    #outputBox {
      width: 100%;
      min-height: 110px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      color: var(--text);
      font-family: 'Space Mono', monospace;
      font-size: 13px; line-height: 1.7;
      padding: 14px 16px;
      white-space: pre-wrap;
      word-break: break-all;
      overflow-y: auto;
      max-height: 280px;
    }
    #outputBox.empty { color: var(--muted); font-style: italic; }

    .copy-btn {
      position: absolute; top: 10px; right: 10px;
      padding: 5px 12px;
      font-size: 11px; font-weight: 700; letter-spacing: 1px;
      border-radius: 6px; cursor: pointer;
      background: var(--surface);
      border: 1px solid var(--border);
      color: var(--sub);
      font-family: 'Syne', sans-serif;
      text-transform: uppercase;
      transition: all .15s;
    }
    .copy-btn:hover { border-color: var(--accent); color: var(--accent); }
    .copy-btn.copied { border-color: var(--green); color: var(--green); }

    /* ── stats bar ── */
    .stats-bar {
      display: flex; gap: 24px; flex-wrap: wrap;
      margin-top: 14px;
      font-family: 'Space Mono', monospace;
      font-size: 11px; color: var(--sub);
    }
    .stat { display: flex; align-items: center; gap: 6px; }
    .stat-val { color: var(--text); font-weight: 700; }
    .stat-badge {
      padding: 2px 8px; border-radius: 20px;
      background: rgba(124,106,255,.15);
      color: var(--accent);
      font-size: 10px; font-weight: 700;
    }

    /* ── toast ── */
    .toast {
      position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 10px 20px;
      font-size: 13px; font-weight: 600;
      display: flex; align-items: center; gap: 8px;
      box-shadow: 0 8px 32px rgba(0,0,0,.5);
      z-index: 999;
      transition: transform .35s cubic-bezier(.34,1.56,.64,1), opacity .3s;
      opacity: 0; pointer-events: none;
    }
    .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
    .toast.error { border-color: var(--red); }
    .toast.error .ti { color: var(--red); }
    .toast.success { border-color: var(--green); }
    .toast.success .ti { color: var(--green); }

    /* ── json status ── */
    .json-status {
      margin-top: 8px; font-size: 11px;
      font-family: 'Space Mono', monospace;
      display: flex; align-items: center; gap: 6px;
      transition: all .2s;
    }
    .json-status.ok { color: var(--green); }
    .json-status.err { color: var(--red); }
    .json-status.idle { color: var(--muted); }

    /* ── animations ── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── theme toggle ── */
    .theme-toggle {
      margin-left: auto;
      display: flex; align-items: center; gap: 8px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 40px;
      padding: 6px 14px 6px 10px;
      cursor: pointer;
      font-family: 'Syne', sans-serif;
      font-size: 12px; font-weight: 700;
      color: var(--sub);
      transition: all .2s;
      flex-shrink: 0;
    }
    .theme-toggle:hover { border-color: var(--accent); color: var(--accent); }
    .theme-toggle .toggle-track {
      width: 32px; height: 18px; border-radius: 99px;
      background: var(--muted);
      position: relative; flex-shrink: 0;
      transition: background .25s;
    }
    .theme-toggle .toggle-thumb {
      width: 12px; height: 12px; border-radius: 50%;
      background: #fff;
      position: absolute; top: 3px; left: 3px;
      transition: transform .25s cubic-bezier(.34,1.56,.64,1);
    }
    html.light .theme-toggle .toggle-track { background: var(--accent); }
    html.light .theme-toggle .toggle-thumb { transform: translateX(14px); }

    /* ── upload zone ── */
    .upload-zone {
      border: 2px dashed var(--border);
      border-radius: 8px;
      padding: 18px 16px;
      text-align: center;
      cursor: pointer;
      transition: border-color .2s, background .2s;
      margin-bottom: 12px;
      position: relative;
    }
    .upload-zone:hover, .upload-zone.drag-over {
      border-color: var(--accent);
      background: rgba(124,106,255,.06);
    }
    .upload-zone input[type="file"] {
      position: absolute; inset: 0; opacity: 0; cursor: pointer; width: 100%; height: 100%;
    }
    .upload-zone-inner {
      pointer-events: none;
      display: flex; align-items: center; justify-content: center; gap: 10px;
      font-size: 13px; color: var(--sub);
      font-family: 'Space Mono', monospace;
    }
    .upload-zone-inner .upload-icon { font-size: 20px; }
    .upload-zone .file-name {
      margin-top: 6px; font-size: 11px;
      font-family: 'Space Mono', monospace;
      color: var(--accent); font-weight: 700;
      pointer-events: none;
    }

    /* ── scrollbar ── */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--muted); border-radius: 99px; }
  </style>
</head>
<body>

<div class="blob blob-1"></div>
<div class="blob blob-2"></div>

<div class="wrapper">

  <!-- Header -->
  <header>
    <div class="logo-icon">⌨️</div>
    <div class="logo-text">
      <h1>Typing Transformer</h1>
      <span>Character-level text mutation engine</span>
    </div>
    <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()" title="Toggle light/dark mode">
      <div class="toggle-track"><div class="toggle-thumb"></div></div>
      <span id="themeLabel">Light</span>
    </button>
  </header>

  <!-- Input teks -->
  <div class="card">
    <div class="card-label"><span class="dot"></span>Input Teks</div>
    <textarea id="inputText" placeholder="Ketik atau paste teks di sini..."></textarea>
  </div>

  <!-- JSON Config -->
  <div class="card">
    <div class="card-label"><span class="dot" style="background:var(--accent2)"></span>Konfigurasi JSON</div>

    <!-- Upload Zone -->
    <div class="upload-zone" id="uploadZone">
      <input type="file" id="jsonFileInput" accept=".json,application/json" onchange="handleFileUpload(event)"/>
      <div class="upload-zone-inner">
        <span class="upload-icon">↑</span>
        <span>Drag & drop file <strong>.json</strong> atau klik untuk pilih</span>
      </div>
      <div class="file-name" id="uploadedFileName" style="display:none"></div>
    </div>

    <textarea class="json-area" id="jsonConfig" spellcheck="false"></textarea>
    <div class="json-status idle" id="jsonStatus">
      <span id="jsonStatusIcon">◉</span>
      <span id="jsonStatusText">Belum divalidasi</span>
    </div>
  </div>

  <!-- Tombol -->
  <div class="card">
    <div class="btn-row">
      <button class="btn-primary" onclick="transform()">
        <span>⚡</span> Transform
      </button>
      <button class="btn-ghost" onclick="validateJSON()">
        <span>✓</span> Validasi JSON
      </button>
      <button class="btn-ghost" onclick="loadDefault()">
        <span>↺</span> Reset JSON
      </button>
      <button class="btn-ghost" onclick="clearAll()">
        <span>✕</span> Hapus Semua
      </button>
    </div>
  </div>

  <!-- Output -->
  <div class="card">
    <div class="card-label"><span class="dot" style="background:var(--green)"></span>Hasil Transformasi</div>
    <div class="output-wrap">
      <div id="outputBox" class="empty">Hasil transformasi akan muncul di sini...</div>
      <button class="copy-btn" id="copyBtn" onclick="copyOutput()">Copy</button>
    </div>
    <div class="stats-bar" id="statsBar" style="display:none">
      <div class="stat">Input: <span class="stat-val" id="statIn">0</span> karakter</div>
      <div class="stat">Output: <span class="stat-val" id="statOut">0</span> karakter</div>
      <div class="stat">Terganti: <span class="stat-val" id="statReplaced">0</span> karakter</div>
      <div class="stat"><span class="stat-badge" id="statRatio">×1.0</span></div>
    </div>
  </div>

</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span class="ti" id="toastIcon"></span>
  <span id="toastMsg"></span>
</div>

<script>
  // ── Default JSON (from uploaded data.json) ──────────────────────────────
  const DEFAULT_JSON = [
    { "abjad": "a", "trans": "aaaaa" }, { "abjad": "b", "trans": "bbbbb" },
    { "abjad": "c", "trans": "ccccc" }, { "abjad": "d", "trans": "ddddd" },
    { "abjad": "e", "trans": "eeeee" }, { "abjad": "f", "trans": "fffff" },
    { "abjad": "g", "trans": "ggggg" }, { "abjad": "h", "trans": "hhhhh" },
    { "abjad": "i", "trans": "iiiii" }, { "abjad": "j", "trans": "jjjjj" },
    { "abjad": "k", "trans": "kkkkk" }, { "abjad": "l", "trans": "lllll" },
    { "abjad": "m", "trans": "mmmmm" }, { "abjad": "n", "trans": "nnnnn" },
    { "abjad": "o", "trans": "ooooo" }, { "abjad": "p", "trans": "ppppp" },
    { "abjad": "q", "trans": "qqqqq" }, { "abjad": "r", "trans": "rrrrr" },
    { "abjad": "s", "trans": "sssss" }, { "abjad": "t", "trans": "ttttt" },
    { "abjad": "u", "trans": "uuuuu" }, { "abjad": "v", "trans": "vvvvv" },
    { "abjad": "w", "trans": "wwwww" }, { "abjad": "x", "trans": "xxxxx" },
    { "abjad": "y", "trans": "yyyyy" }, { "abjad": "z", "trans": "zzzzz" },
    { "abjad": "A", "trans": "AAAAA" }, { "abjad": "B", "trans": "BBBBB" },
    { "abjad": "C", "trans": "CCCCC" }, { "abjad": "D", "trans": "DDDDD" },
    { "abjad": "E", "trans": "EEEEE" }, { "abjad": "F", "trans": "FFFFF" },
    { "abjad": "G", "trans": "GGGGG" }, { "abjad": "H", "trans": "HHHHH" },
    { "abjad": "I", "trans": "IIIII" }, { "abjad": "J", "trans": "JJJJJ" },
    { "abjad": "K", "trans": "KKKKK" }, { "abjad": "L", "trans": "LLLLL" },
    { "abjad": "M", "trans": "MMMMM" }, { "abjad": "N", "trans": "NNNNN" },
    { "abjad": "O", "trans": "OOOOO" }, { "abjad": "P", "trans": "PPPPP" },
    { "abjad": "Q", "trans": "QQQQQ" }, { "abjad": "R", "trans": "RRRRR" },
    { "abjad": "S", "trans": "SSSSS" }, { "abjad": "T", "trans": "TTTTT" },
    { "abjad": "U", "trans": "UUUUU" }, { "abjad": "V", "trans": "VVVVV" },
    { "abjad": "W", "trans": "WWWWW" }, { "abjad": "X", "trans": "XXXXX" },
    { "abjad": "Y", "trans": "YYYYY" }, { "abjad": "Z", "trans": "ZZZZZ" },
    { "abjad": "1", "trans": "11111" }, { "abjad": "2", "trans": "22222" },
    { "abjad": "3", "trans": "33333" }, { "abjad": "4", "trans": "44444" },
    { "abjad": "5", "trans": "55555" }, { "abjad": "6", "trans": "66666" },
    { "abjad": "7", "trans": "77777" }, { "abjad": "8", "trans": "88888" },
    { "abjad": "9", "trans": "99999" }, { "abjad": "0", "trans": "00000" },
    { "abjad": " ", "trans": "     " }, { "abjad": ".", "trans": "....." },
    { "abjad": ",", "trans": ",,,,," }, { "abjad": "!", "trans": "!!!!!" },
    { "abjad": "?", "trans": "?????" }, { "abjad": "@", "trans": "@@@@@" },
    { "abjad": "#", "trans": "#####" }, { "abjad": "$", "trans": "$$$$$" },
    { "abjad": "%", "trans": "%%%%%" }, { "abjad": "&", "trans": "&&&&&" },
    { "abjad": "*", "trans": "*****" }, { "abjad": "(", "trans": "(((((" },
    { "abjad": ")", "trans": ")))))" }, { "abjad": "-", "trans": "-----" },
    { "abjad": "_", "trans": "_____" }, { "abjad": "=", "trans": "=====" },
    { "abjad": "+", "trans": "+++++" }, { "abjad": ":", "trans": ":::::" },
    { "abjad": ";", "trans": ";;;;;" }, { "abjad": "\"", "trans": "\"\"\"\"\"" },
    { "abjad": "'", "trans": "'''''" }, { "abjad": "/", "trans": "/////" },
    { "abjad": "\\", "trans": "\\\\\\\\\\" }, { "abjad": "|", "trans": "|||||" }
  ];

  // ── Theme Toggle ────────────────────────────────────────────────────────
  function toggleTheme() {
    const isLight = document.documentElement.classList.toggle('light');
    document.getElementById('themeLabel').textContent = isLight ? 'Dark' : 'Light';
    localStorage.setItem('tt-theme', isLight ? 'light' : 'dark');
  }

  // Restore saved theme
  (function() {
    const saved = localStorage.getItem('tt-theme');
    if (saved === 'light') {
      document.documentElement.classList.add('light');
      document.getElementById('themeLabel').textContent = 'Dark';
    }
  })();

  // ── File Upload ─────────────────────────────────────────────────────────
  function handleFileUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (!file.name.endsWith('.json') && file.type !== 'application/json') {
      showToast('error', '✕', 'Hanya file .json yang diterima.');
      return;
    }
    const reader = new FileReader();
    reader.onload = function(e) {
      const content = e.target.result;
      document.getElementById('jsonConfig').value = content;
      document.getElementById('uploadedFileName').textContent = '📄 ' + file.name;
      document.getElementById('uploadedFileName').style.display = 'block';
      // Auto validate
      try {
        const data = parseJSONConfig();
        updateJSONStatus('ok', '✓', `Valid — ${data.length} aturan ditemukan`);
        showToast('success', '↑', `"${file.name}" berhasil dimuat. ${data.length} aturan siap.`);
      } catch(err) {
        updateJSONStatus('err', '✕', 'File tidak valid: ' + err.message);
        showToast('error', '✕', 'File JSON tidak valid: ' + err.message);
      }
    };
    reader.onerror = function() {
      showToast('error', '✕', 'Gagal membaca file.');
    };
    reader.readAsText(file);
  }

  // ── Drag & Drop support ─────────────────────────────────────────────────
  const uploadZone = document.getElementById('uploadZone');
  uploadZone.addEventListener('dragover', function(e) {
    e.preventDefault();
    uploadZone.classList.add('drag-over');
  });
  uploadZone.addEventListener('dragleave', function() {
    uploadZone.classList.remove('drag-over');
  });
  uploadZone.addEventListener('drop', function(e) {
    e.preventDefault();
    uploadZone.classList.remove('drag-over');
    const file = e.dataTransfer.files[0];
    if (!file) return;
    // Reuse the same handler via synthetic event-like object
    handleFileUpload({ target: { files: [file] } });
  });

  // ── Init ────────────────────────────────────────────────────────────────
  document.getElementById('jsonConfig').value = JSON.stringify(DEFAULT_JSON, null, 2);
  updateJSONStatus('idle', '◉', 'Belum divalidasi');

  // ── JSON Validation ─────────────────────────────────────────────────────
  function parseJSONConfig() {
    const raw = document.getElementById('jsonConfig').value.trim();
    if (!raw) throw new Error('JSON kosong');
    const parsed = JSON.parse(raw); // throws if invalid
    if (!Array.isArray(parsed)) throw new Error('JSON harus berupa array');
    for (let i = 0; i < parsed.length; i++) {
      const item = parsed[i];
      if (typeof item.abjad !== 'string' || typeof item.trans !== 'string') {
        throw new Error(`Item index ${i} harus punya field "abjad" dan "trans" (string)`);
      }
    }
    return parsed;
  }

  function validateJSON() {
    try {
      const data = parseJSONConfig();
      updateJSONStatus('ok', '✓', `Valid — ${data.length} aturan ditemukan`);
      showToast('success', '✓', `JSON valid. ${data.length} aturan transformasi siap.`);
    } catch (e) {
      updateJSONStatus('err', '✕', 'JSON tidak valid: ' + e.message);
      showToast('error', '✕', 'JSON tidak valid: ' + e.message);
    }
  }

  function updateJSONStatus(type, icon, text) {
    const el = document.getElementById('jsonStatus');
    el.className = 'json-status ' + type;
    document.getElementById('jsonStatusIcon').textContent = icon;
    document.getElementById('jsonStatusText').textContent = text;
  }

  // ── Core Transform ──────────────────────────────────────────────────────
  function transform() {
    const inputText = document.getElementById('inputText').value;
    if (!inputText) {
      showToast('error', '!', 'Input teks kosong. Ketik sesuatu dulu.');
      return;
    }

    let rules;
    try {
      rules = parseJSONConfig();
      updateJSONStatus('ok', '✓', `Valid — ${rules.length} aturan ditemukan`);
    } catch (e) {
      updateJSONStatus('err', '✕', 'JSON tidak valid: ' + e.message);
      showToast('error', '✕', 'JSON tidak valid! Perbaiki dulu sebelum transform.');
      return;
    }

    // Build lookup map (case-sensitive, O(1) lookup)
    const map = new Map();
    for (const rule of rules) {
      map.set(rule.abjad, rule.trans);
    }

    // Loop per karakter — exact match (===), case-sensitive
    let replaced = 0;
    const chars = inputText.split('');
    const result = chars.map(function(ch) {
      if (map.has(ch)) {
        replaced++;
        return map.get(ch);
      }
      return ch;
    }).join('');

    // Render output
    const outputBox = document.getElementById('outputBox');
    outputBox.textContent = result;
    outputBox.classList.remove('empty');

    // Stats
    const ratio = inputText.length > 0 ? (result.length / inputText.length).toFixed(1) : '1.0';
    document.getElementById('statIn').textContent = inputText.length;
    document.getElementById('statOut').textContent = result.length;
    document.getElementById('statReplaced').textContent = replaced;
    document.getElementById('statRatio').textContent = '×' + ratio;
    document.getElementById('statsBar').style.display = 'flex';

    showToast('success', '⚡', `Transform selesai. ${replaced} karakter diubah.`);
  }

  // ── Utilities ───────────────────────────────────────────────────────────
  function copyOutput() {
    const text = document.getElementById('outputBox').textContent;
    if (!text || document.getElementById('outputBox').classList.contains('empty')) {
      showToast('error', '!', 'Tidak ada output untuk dicopy.');
      return;
    }
    navigator.clipboard.writeText(text).then(function() {
      const btn = document.getElementById('copyBtn');
      btn.textContent = 'Copied!';
      btn.classList.add('copied');
      setTimeout(function() {
        btn.textContent = 'Copy';
        btn.classList.remove('copied');
      }, 2000);
      showToast('success', '✓', 'Hasil disalin ke clipboard!');
    });
  }

  function loadDefault() {
    document.getElementById('jsonConfig').value = JSON.stringify(DEFAULT_JSON, null, 2);
    document.getElementById('uploadedFileName').style.display = 'none';
    document.getElementById('jsonFileInput').value = '';
    updateJSONStatus('idle', '◉', 'Belum divalidasi');
    showToast('success', '↺', 'JSON direset ke default.');
  }

  function clearAll() {
    document.getElementById('inputText').value = '';
    const outputBox = document.getElementById('outputBox');
    outputBox.textContent = 'Hasil transformasi akan muncul di sini...';
    outputBox.classList.add('empty');
    document.getElementById('statsBar').style.display = 'none';
    showToast('success', '✕', 'Semua dibersihkan.');
  }

  // ── Toast ───────────────────────────────────────────────────────────────
  let toastTimer = null;
  function showToast(type, icon, msg) {
    const toast = document.getElementById('toast');
    document.getElementById('toastIcon').textContent = icon;
    document.getElementById('toastMsg').textContent = msg;
    toast.className = 'toast ' + type + ' show';
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function() {
      toast.classList.remove('show');
    }, 3000);
  }

  // ── Live JSON validation on change ──────────────────────────────────────
  let jsonTimer = null;
  document.getElementById('jsonConfig').addEventListener('input', function() {
    clearTimeout(jsonTimer);
    updateJSONStatus('idle', '◉', 'Mengetik...');
    jsonTimer = setTimeout(function() {
      try {
        const data = parseJSONConfig();
        updateJSONStatus('ok', '✓', `Valid — ${data.length} aturan ditemukan`);
      } catch (e) {
        updateJSONStatus('err', '✕', e.message);
      }
    }, 600);
  });

  // ── Ctrl+Enter shortcut ──────────────────────────────────────────────────
  document.addEventListener('keydown', function(e) {
    if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
      e.preventDefault();
      transform();
    }
  });
</script>
</body>
</html>
